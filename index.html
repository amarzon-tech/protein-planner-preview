<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Protein Planner">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Set a daily protein target and pick everyday US foods to reach it. Patient education for CKD, dialysis, and general health.">
<title>Protein Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --shadow: 0 .4rem 1.4rem rgba(15, 23, 42, .10);
    --shadowLg: 0 .9rem 2.2rem rgba(15, 23, 42, .16);
    --radius: 1.35rem;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --ink: #f8fafc;
    --ink2: #cbd5e1;
    --teal: #0f766e;
    --tealDeep: #115e59;
    --tealSoft: #ccfbf1;
    --accent: #0d9488;
    --accentHot: #14b8a6;
    --coral: #ea580c;
    --good: #15803d;
    --line: #e2e8f0;
    --cream: #f8fafc;
    --warm: #fff7ed;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(90% 60% at 0% 0%, rgba(45,212,191,.28) 0%, transparent 55%),
      radial-gradient(70% 50% at 100% 10%, rgba(14,165,233,.18) 0%, transparent 50%),
      linear-gradient(165deg, #0f172a 0%, #134e4a 48%, #0f766e 100%);
  }
  .safeCover{ position:fixed; top:0; left:0; right:0; height:var(--sat); background:#0f172a; z-index:50; pointer-events:none; }
  .shell{ position:fixed; inset:0; padding: var(--sat) var(--sar) var(--sab) var(--sal); display:flex; justify-content:center; overflow:hidden; }
  .app{ width:min(32.5rem,100%); height:100%; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; padding:.9rem .85rem 1.35rem; gap:.7rem; overscroll-behavior:contain; }
  [hidden]{ display:none !important; }
  :focus-visible{ outline:3px solid #5eead4; outline-offset:2px; }

  .draftBanner{ flex:none; background:linear-gradient(90deg,#fef3c7,#ffedd5); color:#92400e; font-weight:800; font-size:.7rem; letter-spacing:.04em; text-transform:uppercase; text-align:center;
    padding:.42rem .75rem; border-radius:.85rem; border:1px solid #fcd34d; }
  header{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; flex:none; }
  .brand{ display:flex; gap:.65rem; align-items:center; min-width:0; }
  .logo{ flex:none; width:2.65rem; height:2.65rem; border-radius:1rem;
    background:linear-gradient(145deg,#f0fdfa,#99f6e4); box-shadow:0 .3rem .9rem rgba(15,118,110,.35);
    display:grid; place-items:center; font-size:1.35rem; }
  .title h1{ margin:0; font-size:1.18rem; font-weight:800; letter-spacing:-.03em; }
  .title p{ margin:.1rem 0 0; font-size:.78rem; color:var(--ink2); font-weight:600; letter-spacing:.01em; }
  .iconBtn{ background:rgba(255,255,255,.12); color:var(--ink); border:1px solid rgba(255,255,255,.22);
    border-radius:999px; padding:.45rem .9rem; font-size:.82rem; font-weight:800; backdrop-filter: blur(10px); }

  .card{ background:var(--card); color:var(--text); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:1.05rem 1.05rem 1rem; display:flex; flex-direction:column; gap:.65rem; border:1px solid rgba(255,255,255,.65); }
  .card h2{ margin:0; font-size:1.14rem; font-weight:800; letter-spacing:-.025em; color:#0f172a; }
  .muted{ color:var(--muted); font-size:.88rem; line-height:1.45; }
  .tiny{ font-size:.74rem !important; }
  .disclaimer{ font-size:.74rem; color:#475569; background:var(--cream); border:1px solid var(--line); border-radius:.9rem; padding:.6rem .75rem; line-height:1.4; }

  .profileGrid{ display:grid; gap:.6rem; }
  .profileBtn{ text-align:left; border:1.5px solid var(--line); background:#fff; border-radius:1.15rem; padding:.9rem 1rem; cursor:pointer; font:inherit; color:inherit;
    transition: border-color .15s, transform .1s, box-shadow .15s; box-shadow:0 .12rem .4rem rgba(15,23,42,.04); }
  .profileBtn:active{ transform:scale(.985); }
  .profileBtn:hover, .profileBtn:focus-visible{ border-color:var(--accent); box-shadow:0 .35rem 1rem rgba(13,148,136,.14); }
  .profileBtn strong{ display:block; font-size:1.08rem; letter-spacing:-.02em; }
  .profileBtn span{ display:block; margin-top:.28rem; font-size:.82rem; color:var(--muted); }

  .row{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .row.between{ justify-content:space-between; }
  .field{ display:flex; flex-direction:column; gap:.28rem; }
  .field.grow{ flex:1; min-width:8rem; }
  input, select{ font:inherit; padding:.8rem .9rem; border-radius:1rem; border:1.5px solid #cbd5e1; background:#fff; color:var(--text); width:100%; }
  input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(13,148,136,.18); outline:none; }
  .unitToggle{ display:inline-flex; border:1.5px solid #cbd5e1; border-radius:1rem; overflow:hidden; flex:none; }
  .unitToggle button{ border:0; background:var(--cream); color:#334155; padding:.8rem .85rem; font:inherit; font-weight:800; cursor:pointer; }
  .unitToggle button.on{ background:var(--teal); color:#fff; }

  .suggestCard{ background:linear-gradient(145deg,#f0fdfa,#ccfbf1); border:1.5px solid #99f6e4; border-radius:1.2rem; padding:1.05rem; text-align:center; }
  .suggestBig{ font-size:2.6rem; font-weight:800; letter-spacing:-.045em; color:var(--tealDeep); line-height:1.05; }

  .btn{ border:0; border-radius:1.05rem; padding:.9rem 1.1rem; font:inherit; font-weight:800; cursor:pointer; min-height:2.9rem; letter-spacing:-.01em; }
  .btnPrimary{ background:linear-gradient(135deg,#0f766e,#14b8a6); color:#fff; box-shadow:0 .4rem 1.1rem rgba(15,118,110,.35); }
  .btnPrimary:active{ transform:translateY(1px); }
  .btnGhost{ background:#f0fdfa; color:var(--tealDeep); border:1.5px solid #99f6e4; }
  .btnDanger{ background:#fee2e2; color:#991b1b; }
  .btnBlock{ width:100%; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; }
  .linkish{ border:0; background:none; color:var(--teal); font:inherit; font-weight:800; font-size:.85rem; padding:0; cursor:pointer; }
  .linkish.danger{ color:#b91c1c; }

  .hero{ position:sticky; top:0; z-index:10; gap:.6rem; background:linear-gradient(180deg,#ffffff 72%, #ffffffee); border:1px solid #f1f5f9; }
  .heroRow{ display:flex; gap:1rem; align-items:center; }
  .heroStats{ flex:1; min-width:0; }
  .bigNum{ font-size:2.1rem; font-weight:800; letter-spacing:-.045em; line-height:1; color:#0f172a; }
  .targetLine{ font-size:.95rem; font-weight:700; color:#475569; margin-top:.2rem; }
  .statusLine{ font-size:.84rem; color:var(--muted); margin-top:.4rem; font-weight:600; }
  .statusLine.good{ color:var(--good); font-weight:800; }
  .statusLine.warn{ color:#c2410c; font-weight:800; }

  .plateWrap{ position:relative; width:124px; height:124px; flex:none; }
  .plateSvg{ display:block; filter: drop-shadow(0 .25rem .7rem rgba(15,118,110,.2)); }
  .plateTrack{ fill:none; stroke:#e2e8f0; stroke-width:10; }
  .plateFill{ fill:none; stroke:url(#plateGrad); stroke:#0d9488; stroke-width:10; stroke-linecap:round; transition: stroke-dasharray .4s cubic-bezier(.22,1,.36,1); }
  .plateFill.over{ stroke:#dc2626; }
  .plateWrap.hit .plateFill{ stroke:#16a34a; }
  .plateCenter{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .plateEmoji{ font-size:1.5rem; line-height:1; }
  .platePct{ font-size:.82rem; font-weight:800; color:var(--tealDeep); letter-spacing:-.02em; }

  .toast{ background:linear-gradient(135deg,#0f766e,#0d9488); color:#ecfdf5; font-weight:800; font-size:.88rem; text-align:center;
    padding:.58rem .75rem; border-radius:.95rem; animation: pop .35s ease; box-shadow:0 .35rem .9rem rgba(15,118,110,.28); }
  @keyframes pop{ from{ transform:translateY(6px); opacity:0 } to{ transform:none; opacity:1 } }

  .mChips{ display:flex; flex-wrap:wrap; gap:.3rem; align-items:center; margin-top:.25rem; }
  .mChip{ font-size:.68rem; font-weight:800; padding:.22rem .52rem; border-radius:999px; background:var(--cream); color:#475569; border:1px solid var(--line); }
  .mChipUnit{ font-size:.65rem; color:var(--muted); }

  .chips{ display:flex; gap:.35rem; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:.15rem; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:none; border:1px solid #cbd5e1; background:#fff; border-radius:999px; padding:.4rem .75rem; font-size:.76rem; font-weight:700; cursor:pointer; color:#334155; min-height:2.05rem; }
  .chip.on{ background:var(--teal); color:#fff; border-color:var(--teal); box-shadow:0 .2rem .55rem rgba(15,118,110,.25); }

  .foodList{ display:flex; flex-direction:column; gap:.55rem; }
  .foodItem, .planItem{ display:grid; grid-template-columns:auto 1fr auto; gap:.65rem; align-items:center;
    border:1.5px solid var(--line); border-radius:1.2rem; padding:.75rem .8rem; background:#fff;
    box-shadow:0 .08rem .35rem rgba(15,23,42,.03); transition: border-color .15s, box-shadow .15s; }
  .foodItem.featured{ border-color:#99f6e4; background:linear-gradient(145deg,#fff,#f0fdfa); box-shadow:0 .2rem .7rem rgba(13,148,136,.08); }
  .emoji{ font-size:1.55rem; line-height:1; }
  .name{ font-weight:800; font-size:.94rem; line-height:1.25; letter-spacing:-.015em; }
  .meta{ font-size:.76rem; color:var(--muted); margin-top:.14rem; }
  .meta b{ color:var(--tealDeep); font-size:.88rem; }
  .foodActions{ display:flex; flex-direction:column; gap:.25rem; align-items:center; }
  .addBtn{ border:0; background:linear-gradient(135deg,#0f766e,#14b8a6); color:#fff; border-radius:1rem;
    width:2.6rem; height:2.6rem; font-size:1.35rem; font-weight:800; cursor:pointer; line-height:1;
    box-shadow:0 .25rem .65rem rgba(15,118,110,.3); }
  .srcBtn{ border:0; background:var(--cream); color:#64748b; border-radius:999px; width:1.45rem; height:1.45rem; font-size:.7rem; font-weight:800; cursor:pointer; border:1px solid var(--line); }
  .srcLine{ font-size:.65rem; color:#64748b; line-height:1.3; margin-top:.25rem; }

  .qty{ display:flex; align-items:center; gap:.25rem; }
  .qty button{ width:2rem; height:2rem; border-radius:.7rem; border:0; background:#f0fdfa; color:var(--tealDeep); font-weight:900; cursor:pointer; border:1px solid #99f6e4; }
  .qty span{ min-width:1.35rem; text-align:center; font-weight:800; }
  .remove{ border:0; background:transparent; color:#b91c1c; font-weight:800; font-size:.72rem; cursor:pointer; padding:.25rem; }

  .tabs{ display:flex; gap:.4rem; flex:none; padding:.12rem; background:rgba(15,23,42,.22); border-radius:1.15rem; border:1px solid rgba(255,255,255,.12); }
  .tabs button{ flex:1; border:0; background:transparent; color:var(--ink2);
    border-radius:1rem; padding:.65rem .4rem; font:inherit; font-weight:800; font-size:.88rem; cursor:pointer; min-height:2.75rem; }
  .tabs button.on{ background:#fff; color:var(--tealDeep); box-shadow:var(--shadow); }

  .footerLinks{ display:flex; gap:.8rem; flex-wrap:wrap; font-size:.78rem; }
  .footerLinks a{ color:var(--teal); font-weight:700; }

  .setSwitch{ display:flex; gap:.3rem; flex-wrap:wrap; justify-content:flex-end; max-width:100%; }
  .setBtn{ border:1px solid #cbd5e1; background:#fff; border-radius:999px; padding:.4rem .72rem; font:inherit; font-size:.72rem; font-weight:800; cursor:pointer; color:#334155; min-height:2.05rem; }
  .setBtn.on{ background:var(--tealDeep); color:#fff; border-color:var(--tealDeep); }

  .mealRow{ display:flex; gap:.4rem; flex-wrap:wrap; align-items:stretch; }
  .mealChip{ flex:1 1 5.5rem; min-width:5.2rem; border:1.5px solid var(--line); background:#fff; border-radius:1.05rem;
    padding:.58rem .55rem; text-align:left; cursor:pointer; font:inherit; min-height:3.15rem;
    transition: border-color .15s, background .15s, box-shadow .15s; }
  .mealChip b{ display:block; font-size:.7rem; color:#64748b; font-weight:800; letter-spacing:.03em; text-transform:uppercase; }
  .mealChip span{ font-size:.84rem; font-weight:800; color:var(--tealDeep); letter-spacing:-.02em; }
  .mealChip.on{ border-color:var(--accent); background:#f0fdfa; box-shadow:0 0 0 3px rgba(13,148,136,.16); }
  .mealChip.filled span{ color:var(--good); }
  .mealChip.role-breakfast.on{ background:linear-gradient(160deg,#fffbeb,#fef3c7); border-color:#fbbf24; box-shadow:0 0 0 3px rgba(251,191,36,.18); }
  .mealChip.role-lunch.on{ background:linear-gradient(160deg,#f0fdfa,#ccfbf1); }
  .mealChip.role-dinner.on{ background:linear-gradient(160deg,#eff6ff,#dbeafe); border-color:#93c5fd; box-shadow:0 0 0 3px rgba(59,130,246,.14); }
  .mealChip.role-snack.on{ background:linear-gradient(160deg,#f0fdf4,#dcfce7); border-color:#86efac; box-shadow:0 0 0 3px rgba(34,197,94,.14); }
  .mealAdjust{ display:inline-flex; align-items:center; gap:.25rem; }
  .mealAdjust button{ width:1.85rem; height:1.85rem; border:0; border-radius:.65rem; background:#f0fdfa; color:var(--tealDeep); border:1px solid #99f6e4; font-weight:900; cursor:pointer; }
  .suggestCard.soft{ background:#fff; border-color:var(--line); text-align:left; }

  .mealHeading{ display:flex; flex-direction:column; gap:.4rem; min-width:0; flex:1; }
  .mealBadge{ display:inline-flex; align-items:center; gap:.35rem; width:fit-content;
    background:linear-gradient(135deg,#f0fdfa,#ccfbf1); border:1.5px solid #5eead4; color:var(--tealDeep);
    font-weight:800; font-size:.95rem; padding:.38rem .8rem; border-radius:999px; letter-spacing:-.015em; }
  .leftCue{ font-size:.95rem; color:#475569; font-weight:700; }
  .leftCue b{ color:var(--tealDeep); font-size:1.22rem; font-weight:800; letter-spacing:-.03em; }
  .suggestLabel{ font-size:.7rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#94a3b8; margin-bottom:.15rem; }

  .suggestRow{ display:flex; flex-direction:column; gap:.5rem; }
  .suggestCardBtn{ display:grid; grid-template-columns:auto 1fr auto; gap:.7rem; align-items:center; text-align:left;
    border:1.5px solid #99f6e4; background:linear-gradient(145deg,#fff,#f0fdfa); border-radius:1.2rem;
    padding:.8rem .85rem; font:inherit; cursor:pointer; min-height:3.5rem;
    box-shadow:0 .22rem .75rem rgba(13,148,136,.1); transition: transform .12s, box-shadow .15s; }
  .suggestCardBtn:active{ transform:scale(.985); }
  .suggestCardBtn .name{ font-weight:800; font-size:.94rem; }
  .suggestCardBtn .sugBody{ display:flex; flex-direction:column; gap:.1rem; min-width:0; }
  .suggestCardBtn .sugServing{ font-size:.7rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:12rem; }
  .suggestCardBtn .sugProt{ display:flex; flex-direction:column; align-items:flex-end; gap:.05rem; }
  .suggestCardBtn .sugProt b{ color:var(--tealDeep); font-size:1.08rem; font-weight:800; letter-spacing:-.02em; }
  .suggestCardBtn .sugProt span{ font-size:.65rem; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:.05em; }

  .guide h2{ margin:0; }
  .nextMealBlock{ display:flex; flex-direction:column; gap:.55rem; }
  .celebrate{ text-align:center; background:linear-gradient(180deg,#ecfdf5 0%, #fff 55%); border:1.5px solid #6ee7b7; padding:1.35rem 1.05rem; gap:.75rem; box-shadow:0 .4rem 1.2rem rgba(16,185,129,.12); }
  .celebEmoji{ font-size:2.5rem; line-height:1; animation: pop .45s ease; }
  .celebrate h2{ color:var(--good); font-size:1.28rem; letter-spacing:-.02em; }
  .mineralsCompact{ margin-top:.15rem; }
  .addBtn:disabled{ opacity:.35; cursor:not-allowed; box-shadow:none; }

  @media (prefers-reduced-motion: reduce){
    .toast, .celebEmoji, .plateFill, .suggestCardBtn, .profileBtn { animation:none; transition:none; }
  }

  .shakeCard{ padding:.9rem 1.05rem 1.05rem; background:linear-gradient(180deg,#fff,#f8fafc); }
  .shakeRow{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.55rem; }
  .shakeChip{ display:inline-flex; align-items:center; gap:.35rem; border:1.5px solid #99f6e4; background:linear-gradient(145deg,#f0fdfa,#ccfbf1);
    border-radius:999px; padding:.38rem .75rem; font-weight:700; font-size:.78rem; color:var(--text); cursor:pointer;
    box-shadow:0 .12rem .4rem rgba(13,148,136,.08); }
  .shakeChip .emoji{ font-size:1rem; }
  .shakeChip .shakeName{ max-width:9.5rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .shakeChip .shakeProt{ color:var(--tealDeep); font-weight:800; }
  .shakeChip:active{ transform:scale(.97); }


  .shareActions{ display:flex; flex-direction:column; gap:.45rem; }
  .sheetScrim{ position:fixed; inset:0; z-index:80; background:rgba(15,23,42,.55); display:flex; align-items:flex-end; justify-content:center; padding: var(--sat) var(--sar) var(--sab) var(--sal); backdrop-filter: blur(4px); }
  .sheet{ width:min(32.5rem,100%); max-height:min(88vh, 40rem); overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:#fff; color:var(--text); border-radius:1.5rem 1.5rem 0 0; box-shadow:var(--shadowLg);
    padding:.55rem 1.05rem calc(1.1rem + var(--sab)); display:flex; flex-direction:column; gap:.55rem;
    animation: sheetUp .28s cubic-bezier(.22,1,.36,1); }
  .sheetHandle{ width:2.6rem; height:.28rem; border-radius:999px; background:#cbd5e1; margin:.15rem auto .35rem; }
  .sharePreview{ white-space:pre-wrap; word-break:break-word; font-size:.72rem; line-height:1.4; color:#334155;
    background:var(--cream); border:1px solid var(--line); border-radius:1rem; padding:.75rem .8rem; max-height:10rem; overflow:auto; margin:0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .shopList{ display:flex; flex-direction:column; gap:.5rem; }
  .shopItem{ display:grid; grid-template-columns:auto 1fr auto; gap:.55rem; align-items:center;
    border:1.5px solid var(--line); border-radius:1.15rem; padding:.7rem .75rem; background:#fff; }
  .shopBody{ min-width:0; }
  .shopLinks{ display:flex; flex-direction:column; gap:.3rem; }
  .shopLink{ display:inline-flex; align-items:center; justify-content:center; min-height:2.15rem; min-width:4.6rem;
    padding:.35rem .55rem; border-radius:.75rem; font-size:.72rem; font-weight:800; text-decoration:none;
    background:linear-gradient(135deg,#0f766e,#14b8a6); color:#fff; box-shadow:0 .2rem .55rem rgba(15,118,110,.25); }
  .shopLink.costco{ background:linear-gradient(135deg,#1e3a8a,#2563eb); box-shadow:0 .2rem .55rem rgba(37,99,235,.25); }
  @keyframes sheetUp{ from{ transform:translateY(18px); opacity:0 } to{ transform:none; opacity:1 } }
  @media (prefers-reduced-motion: reduce){ .sheet { animation:none; } }

</style>
</head>
<body>
<div class="safeCover" aria-hidden="true"></div>
<div class="shell">
  <div class="app" id="app" role="application" aria-label="Protein Planner"></div>
</div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
