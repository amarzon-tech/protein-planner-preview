<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Protein Planner">
<meta name="theme-color" content="#9a3412">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Set a daily protein target and pick everyday US foods to reach it. Patient education for CKD, dialysis, and general health.">
<title>Protein Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --shadow: 0 .5rem 1.6rem rgba(28, 25, 23, .12);
    --shadowLg: 0 1rem 2.4rem rgba(28, 25, 23, .18);
    --radius: 1.4rem;
    --card: #fffdf9;
    --text: #1c1917;
    --muted: #78716c;
    --bgA: #9a3412;
    --bgB: #ea580c;
    --bgC: #fb923c;
    --accent1: #fdba74;
    --accent2: #fed7aa;
    --ink: #fff7ed;
    --ink2: #ffedd5;
    --teal: #0f766e;
    --tealSoft: #ccfbf1;
    --coral: #f97316;
    --good: #15803d;
    --line: #f5e6d3;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(120% 80% at 10% -10%, #fb923c 0%, transparent 55%),
      radial-gradient(90% 70% at 100% 0%, #fdba74 0%, transparent 50%),
      linear-gradient(160deg, #7c2d12 0%, #c2410c 42%, #ea580c 100%);
  }
  .safeCover{ position:fixed; top:0; left:0; right:0; height:var(--sat); background:#7c2d12; z-index:50; pointer-events:none; }
  .shell{ position:fixed; inset:0; padding: var(--sat) var(--sar) var(--sab) var(--sal); display:flex; justify-content:center; overflow:hidden; }
  .app{ width:min(32.5rem,100%); height:100%; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; padding:.85rem .8rem 1.25rem; gap:.65rem; overscroll-behavior:contain; }
  [hidden]{ display:none !important; }
  :focus-visible{ outline:3px solid #fbbf24; outline-offset:2px; }

  .draftBanner{ flex:none; background:#fef3c7; color:#78350f; font-weight:800; font-size:.72rem; letter-spacing:.02em; text-align:center;
    padding:.4rem .7rem; border-radius:.9rem; border:1px solid #fcd34d; }
  header{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; flex:none; }
  .brand{ display:flex; gap:.6rem; align-items:center; min-width:0; }
  .logo{ flex:none; width:2.55rem; height:2.55rem; border-radius:.95rem;
    background:linear-gradient(145deg,#fff7ed,#fdba74); box-shadow:0 .25rem .7rem rgba(0,0,0,.18);
    display:grid; place-items:center; font-size:1.3rem; }
  .title h1{ margin:0; font-size:1.12rem; font-weight:900; letter-spacing:-.02em; }
  .title p{ margin:.08rem 0 0; font-size:.78rem; color:var(--ink2); font-weight:600; }
  .iconBtn{ background:rgba(28,25,23,.28); color:var(--ink); border:1px solid rgba(255,237,213,.35);
    border-radius:999px; padding:.42rem .85rem; font-size:.82rem; font-weight:800; backdrop-filter: blur(6px); }

  .card{ background:var(--card); color:var(--text); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:1rem 1rem .95rem; display:flex; flex-direction:column; gap:.6rem; border:1px solid rgba(255,255,255,.55); }
  .card h2{ margin:0; font-size:1.12rem; font-weight:900; letter-spacing:-.02em; }
  .muted{ color:var(--muted); font-size:.88rem; line-height:1.4; }
  .tiny{ font-size:.74rem !important; }
  .disclaimer{ font-size:.74rem; color:#57534e; background:#fff7ed; border:1px solid var(--line); border-radius:.85rem; padding:.55rem .7rem; line-height:1.35; }

  .profileGrid{ display:grid; gap:.55rem; }
  .profileBtn{ text-align:left; border:2px solid var(--line); background:#fff; border-radius:1.1rem; padding:.85rem .95rem; cursor:pointer; font:inherit; color:inherit;
    transition: border-color .15s, transform .1s, box-shadow .15s; box-shadow:0 .15rem .5rem rgba(28,25,23,.04); }
  .profileBtn:active{ transform:scale(.985); }
  .profileBtn:hover, .profileBtn:focus-visible{ border-color:var(--coral); box-shadow:0 .35rem 1rem rgba(249,115,22,.15); }
  .profileBtn strong{ display:block; font-size:1.08rem; }
  .profileBtn span{ display:block; margin-top:.25rem; font-size:.82rem; color:var(--muted); }

  .row{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .row.between{ justify-content:space-between; }
  .field{ display:flex; flex-direction:column; gap:.25rem; }
  .field.grow{ flex:1; min-width:8rem; }
  input, select{ font:inherit; padding:.78rem .85rem; border-radius:1rem; border:1.5px solid #e7d5c0; background:#fff; color:var(--text); width:100%; }
  input:focus{ border-color:var(--coral); box-shadow:0 0 0 3px rgba(249,115,22,.18); outline:none; }
  .unitToggle{ display:inline-flex; border:1.5px solid #e7d5c0; border-radius:1rem; overflow:hidden; flex:none; }
  .unitToggle button{ border:0; background:#fff7ed; color:#44403c; padding:.78rem .8rem; font:inherit; font-weight:800; cursor:pointer; }
  .unitToggle button.on{ background:var(--coral); color:#fff; }

  .suggestCard{ background:linear-gradient(145deg,#fff7ed,#ffedd5); border:1.5px solid #fdba74; border-radius:1.15rem; padding:1rem; text-align:center; }
  .suggestBig{ font-size:2.55rem; font-weight:900; letter-spacing:-.04em; color:#c2410c; line-height:1.05; }

  .btn{ border:0; border-radius:1.05rem; padding:.88rem 1.05rem; font:inherit; font-weight:800; cursor:pointer; min-height:2.85rem; }
  .btnPrimary{ background:linear-gradient(135deg,#ea580c,#f97316); color:#fff; box-shadow:0 .35rem 1rem rgba(234,88,12,.35); }
  .btnPrimary:active{ transform:translateY(1px); }
  .btnGhost{ background:#fff7ed; color:#9a3412; border:1.5px solid #fdba74; }
  .btnDanger{ background:#fee2e2; color:#991b1b; }
  .btnBlock{ width:100%; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; }
  .linkish{ border:0; background:none; color:#c2410c; font:inherit; font-weight:800; font-size:.85rem; padding:0; cursor:pointer; }
  .linkish.danger{ color:#b91c1c; }

  .hero{ position:sticky; top:0; z-index:10; gap:.55rem; background:linear-gradient(180deg,#fffdf9 70%, #fffdf9ee); }
  .heroRow{ display:flex; gap:.9rem; align-items:center; }
  .heroStats{ flex:1; min-width:0; }
  .bigNum{ font-size:2rem; font-weight:900; letter-spacing:-.04em; line-height:1; color:#1c1917; }
  .targetLine{ font-size:.95rem; font-weight:800; color:#57534e; margin-top:.18rem; }
  .statusLine{ font-size:.84rem; color:var(--muted); margin-top:.4rem; font-weight:600; }
  .statusLine.good{ color:var(--good); font-weight:800; }
  .statusLine.warn{ color:#c2410c; font-weight:800; }

  .plateWrap{ position:relative; width:118px; height:118px; flex:none; }
  .plateSvg{ display:block; filter: drop-shadow(0 .2rem .5rem rgba(234,88,12,.18)); }
  .plateTrack{ fill:none; stroke:#f5e6d3; stroke-width:9; }
  .plateFill{ fill:none; stroke:var(--coral); stroke-width:9; stroke-linecap:round; transition: stroke-dasharray .35s ease; }
  .plateFill.over{ stroke:#dc2626; }
  .plateWrap.hit .plateFill{ stroke:#22c55e; }
  .plateCenter{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .plateEmoji{ font-size:1.45rem; line-height:1; }
  .platePct{ font-size:.8rem; font-weight:900; color:#c2410c; }

  .toast{ background:linear-gradient(135deg,#0f766e,#14b8a6); color:#ecfdf5; font-weight:800; font-size:.88rem; text-align:center;
    padding:.55rem .7rem; border-radius:.9rem; animation: pop .35s ease; box-shadow:0 .3rem .8rem rgba(15,118,110,.25); }
  @keyframes pop{ from{ transform:translateY(6px); opacity:0 } to{ transform:none; opacity:1 } }

  .mChips{ display:flex; flex-wrap:wrap; gap:.3rem; align-items:center; margin-top:.25rem; }
  .mChip{ font-size:.68rem; font-weight:800; padding:.2rem .5rem; border-radius:999px; background:#fff7ed; color:#57534e; border:1px solid var(--line); }
  .mChipUnit{ font-size:.65rem; color:var(--muted); }

  .chips{ display:flex; gap:.35rem; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:.15rem; }
  .chip{ flex:none; border:1px solid #e7d5c0; background:#fff; border-radius:999px; padding:.38rem .7rem; font-size:.76rem; font-weight:700; cursor:pointer; color:#44403c; min-height:2rem; }
  .chip.on{ background:var(--coral); color:#fff; border-color:var(--coral); }

  .foodList{ display:flex; flex-direction:column; gap:.5rem; }
  .foodItem, .planItem{ display:grid; grid-template-columns:auto 1fr auto; gap:.6rem; align-items:center;
    border:1.5px solid var(--line); border-radius:1.15rem; padding:.7rem .75rem; background:#fff;
    box-shadow:0 .1rem .4rem rgba(28,25,23,.04); }
  .foodItem.featured{ border-color:#fdba74; background:#fff7ed; }
  .emoji{ font-size:1.55rem; line-height:1; }
  .name{ font-weight:800; font-size:.94rem; line-height:1.25; letter-spacing:-.01em; }
  .meta{ font-size:.76rem; color:var(--muted); margin-top:.14rem; }
  .meta b{ color:#c2410c; font-size:.88rem; }
  .foodActions{ display:flex; flex-direction:column; gap:.25rem; align-items:center; }
  .addBtn{ border:0; background:linear-gradient(135deg,#ea580c,#f97316); color:#fff; border-radius:.95rem;
    width:2.55rem; height:2.55rem; font-size:1.35rem; font-weight:800; cursor:pointer; line-height:1;
    box-shadow:0 .2rem .55rem rgba(234,88,12,.3); }
  .srcBtn{ border:0; background:#fff7ed; color:#78716c; border-radius:999px; width:1.45rem; height:1.45rem; font-size:.7rem; font-weight:800; cursor:pointer; border:1px solid var(--line); }
  .srcLine{ font-size:.65rem; color:#78716c; line-height:1.3; margin-top:.25rem; }

  .qty{ display:flex; align-items:center; gap:.25rem; }
  .qty button{ width:2rem; height:2rem; border-radius:.7rem; border:0; background:#fff7ed; color:#9a3412; font-weight:900; cursor:pointer; border:1px solid #fdba74; }
  .qty span{ min-width:1.35rem; text-align:center; font-weight:800; }
  .remove{ border:0; background:transparent; color:#b91c1c; font-weight:800; font-size:.72rem; cursor:pointer; padding:.25rem; }

  .tabs{ display:flex; gap:.4rem; flex:none; padding:.1rem; }
  .tabs button{ flex:1; border:1px solid rgba(255,237,213,.32); background:rgba(28,25,23,.22); color:var(--ink);
    border-radius:1rem; padding:.62rem .4rem; font:inherit; font-weight:800; font-size:.88rem; cursor:pointer; min-height:2.7rem; }
  .tabs button.on{ background:#fffdf9; color:#9a3412; box-shadow:var(--shadow); }

  .footerLinks{ display:flex; gap:.8rem; flex-wrap:wrap; font-size:.78rem; }
  .footerLinks a{ color:#c2410c; font-weight:700; }

  .setSwitch{ display:flex; gap:.3rem; flex-wrap:wrap; justify-content:flex-end; max-width:100%; }
  .setBtn{ border:1px solid #e7d5c0; background:#fff; border-radius:999px; padding:.38rem .7rem; font:inherit; font-size:.72rem; font-weight:800; cursor:pointer; color:#44403c; min-height:2rem; }
  .setBtn.on{ background:#9a3412; color:#fff; border-color:#9a3412; }

  .mealRow{ display:flex; gap:.4rem; flex-wrap:wrap; align-items:stretch; }
  .mealChip{ flex:1 1 5.5rem; min-width:5.2rem; border:1.5px solid var(--line); background:#fff; border-radius:1rem;
    padding:.55rem .55rem; text-align:left; cursor:pointer; font:inherit; min-height:3.1rem;
    transition: border-color .15s, background .15s, box-shadow .15s; }
  .mealChip b{ display:block; font-size:.72rem; color:#57534e; font-weight:800; letter-spacing:.01em; }
  .mealChip span{ font-size:.82rem; font-weight:900; color:#c2410c; }
  .mealChip.on{ border-color:var(--coral); background:#fff7ed; box-shadow:0 0 0 3px rgba(249,115,22,.18); }
  .mealChip.filled span{ color:var(--good); }
  .mealChip.role-breakfast.on{ background:linear-gradient(160deg,#fff7ed,#ffedd5); }
  .mealChip.role-lunch.on{ background:linear-gradient(160deg,#fffbeb,#fef3c7); }
  .mealChip.role-dinner.on{ background:linear-gradient(160deg,#fff1f2,#ffe4e6); }
  .mealChip.role-snack.on{ background:linear-gradient(160deg,#f0fdf4,#dcfce7); }
  .mealAdjust{ display:inline-flex; align-items:center; gap:.25rem; }
  .mealAdjust button{ width:1.85rem; height:1.85rem; border:0; border-radius:.65rem; background:#fff7ed; color:#9a3412; border:1px solid #fdba74; font-weight:900; cursor:pointer; }
  .suggestCard.soft{ background:#fff; border-color:var(--line); text-align:left; }

  .mealHeading{ display:flex; flex-direction:column; gap:.35rem; min-width:0; flex:1; }
  .mealBadge{ display:inline-flex; align-items:center; gap:.35rem; width:fit-content;
    background:linear-gradient(135deg,#fff7ed,#ffedd5); border:1.5px solid #fdba74; color:#9a3412;
    font-weight:900; font-size:.95rem; padding:.35rem .75rem; border-radius:999px; letter-spacing:-.01em; }
  .leftCue{ font-size:.95rem; color:#57534e; font-weight:700; }
  .leftCue b{ color:#c2410c; font-size:1.2rem; font-weight:900; }
  .suggestLabel{ font-size:.72rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#a8a29e; margin-bottom:.15rem; }

  .suggestRow{ display:flex; flex-direction:column; gap:.45rem; }
  .suggestCardBtn{ display:grid; grid-template-columns:auto 1fr auto; gap:.65rem; align-items:center; text-align:left;
    border:1.5px solid #fdba74; background:linear-gradient(145deg,#fff,#fff7ed); border-radius:1.15rem;
    padding:.75rem .8rem; font:inherit; cursor:pointer; min-height:3.4rem;
    box-shadow:0 .2rem .7rem rgba(249,115,22,.1); transition: transform .1s, box-shadow .15s; }
  .suggestCardBtn:active{ transform:scale(.985); }
  .suggestCardBtn .name{ font-weight:800; font-size:.94rem; }
  .suggestCardBtn .sugBody{ display:flex; flex-direction:column; gap:.1rem; min-width:0; }
  .suggestCardBtn .sugServing{ font-size:.7rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:12rem; }
  .suggestCardBtn .sugProt{ display:flex; flex-direction:column; align-items:flex-end; gap:.05rem; }
  .suggestCardBtn .sugProt b{ color:#c2410c; font-size:1.05rem; font-weight:900; }
  .suggestCardBtn .sugProt span{ font-size:.65rem; font-weight:800; color:#ea580c; text-transform:uppercase; letter-spacing:.04em; }

  .guide h2{ margin:0; }
  .nextMealBlock{ display:flex; flex-direction:column; gap:.55rem; }
  .celebrate{ text-align:center; background:linear-gradient(180deg,#ecfdf5 0%, #fffdf9 55%); border:1.5px solid #86efac; padding:1.25rem 1rem; gap:.7rem; }
  .celebEmoji{ font-size:2.4rem; line-height:1; animation: pop .45s ease; }
  .celebrate h2{ color:var(--good); font-size:1.25rem; }
  .mineralsCompact{ margin-top:.15rem; }
  .addBtn:disabled{ opacity:.35; cursor:not-allowed; box-shadow:none; }

  @media (prefers-reduced-motion: reduce){
    .toast, .celebEmoji, .plateFill, .suggestCardBtn, .profileBtn { animation:none; transition:none; }
  }

  .shakeCard{ padding:.85rem 1rem 1rem; }
  .shakeRow{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.55rem; }
  .shakeChip{ display:inline-flex; align-items:center; gap:.35rem; border:1.5px solid #fdba74; background:linear-gradient(145deg,#fff7ed,#ffedd5);
    border-radius:999px; padding:.35rem .7rem; font-weight:700; font-size:.78rem; color:var(--ink); cursor:pointer; }
  .shakeChip .emoji{ font-size:1rem; }
  .shakeChip .shakeName{ max-width:9.5rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .shakeChip .shakeProt{ color:#c2410c; font-weight:900; }
  .shakeChip:active{ transform:scale(.97); }

</style>
</head>
<body>
<div class="safeCover" aria-hidden="true"></div>
<div class="shell">
  <div class="app" id="app" role="application" aria-label="Protein Planner"></div>
</div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
