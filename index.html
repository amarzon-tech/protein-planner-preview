<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Protein Planner">
<meta name="theme-color" content="#06261f">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Set a daily protein target and pick everyday US foods to reach it. Patient education for CKD, dialysis, and general health.">
<title>Protein Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --shadow:0 .9rem 2.4rem rgba(0,0,0,.28);
    --radius:1.35rem;
    --card:#ffffff; --text:#0f172a; --muted:#64748b;
    --bgA:#06261f; --bgB:#0f766e; --accent1:#5eead4; --accent2:#a7f3d0;
    --ink:#ecfdf5; --ink2:#ccfbf1;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body{ font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:var(--ink);
    background: linear-gradient(145deg, var(--bgA), var(--bgB)); }
  .safeCover{ position:fixed; top:0; left:0; right:0; height:var(--sat); background:var(--bgA); z-index:50; pointer-events:none; }
  .shell{ position:fixed; inset:0; padding: var(--sat) var(--sar) var(--sab) var(--sal); display:flex; justify-content:center; overflow:hidden; }
  .app{ width:min(32.5rem,100%); height:100%; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; padding:.75rem .75rem 1.1rem; gap:.55rem; overscroll-behavior:contain; }
  [hidden]{ display:none !important; }
  :focus-visible{ outline:3px solid #fbbf24; outline-offset:2px; }

  .draftBanner{ flex:none; background:#fbbf24; color:#422006; font-weight:800; font-size:.75rem; text-align:center;
    padding:.35rem .6rem; border-radius:.8rem; }
  header{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; flex:none; }
  .brand{ display:flex; gap:.55rem; align-items:center; min-width:0; }
  .logo{ flex:none; width:2.35rem; height:2.35rem; border-radius:.8rem; background:linear-gradient(135deg,var(--accent1),var(--accent2)); display:grid; place-items:center; font-size:1.2rem; }
  .title h1{ margin:0; font-size:1.05rem; }
  .title p{ margin:.05rem 0 0; font-size:.75rem; color:var(--ink2); }
  .iconBtn{ background:rgba(2,6,23,.35); color:var(--ink); border:1px solid rgba(204,251,241,.28); border-radius:999px; padding:.35rem .7rem; font-size:.8rem; font-weight:700; }

  .card{ background:var(--card); color:var(--text); border-radius:var(--radius); box-shadow:var(--shadow); padding:.9rem; display:flex; flex-direction:column; gap:.55rem; }
  .card h2{ margin:0; font-size:1.05rem; }
  .muted{ color:var(--muted); font-size:.86rem; line-height:1.35; }
  .tiny{ font-size:.72rem !important; }
  .disclaimer{ font-size:.72rem; color:#475569; background:#f1f5f9; border-radius:.7rem; padding:.5rem .65rem; line-height:1.3; }

  .profileGrid{ display:grid; gap:.5rem; }
  .profileBtn{ text-align:left; border:2px solid #e2e8f0; background:#fff; border-radius:1rem; padding:.75rem .85rem; cursor:pointer; font:inherit; color:inherit; transition: border-color .15s, transform .1s; }
  .profileBtn:active{ transform:scale(.98); }
  .profileBtn:hover, .profileBtn:focus-visible{ border-color:#14b8a6; }
  .profileBtn strong{ display:block; font-size:1.05rem; }
  .profileBtn span{ display:block; margin-top:.2rem; font-size:.8rem; color:var(--muted); }

  .row{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .row.between{ justify-content:space-between; }
  .field{ display:flex; flex-direction:column; gap:.25rem; }
  .field.grow{ flex:1; min-width:8rem; }
  input, select{ font:inherit; padding:.7rem .75rem; border-radius:.85rem; border:1.5px solid #cbd5e1; background:#fff; color:var(--text); width:100%; }
  .unitToggle{ display:inline-flex; border:1.5px solid #cbd5e1; border-radius:.85rem; overflow:hidden; flex:none; }
  .unitToggle button{ border:0; background:#f8fafc; color:#334155; padding:.7rem .75rem; font:inherit; font-weight:700; cursor:pointer; }
  .unitToggle button.on{ background:#0f766e; color:#fff; }

  .suggestCard{ background:linear-gradient(135deg,#ecfdf5,#f0fdfa); border:1.5px solid #99f6e4; border-radius:1rem; padding:.85rem; text-align:center; }
  .suggestBig{ font-size:2.4rem; font-weight:900; letter-spacing:-.03em; color:#0f766e; line-height:1.05; }

  .btn{ border:0; border-radius:.95rem; padding:.8rem 1rem; font:inherit; font-weight:800; cursor:pointer; }
  .btnPrimary{ background:linear-gradient(135deg,#0f766e,#14b8a6); color:#fff; }
  .btnGhost{ background:#e2e8f0; color:#0f172a; }
  .btnDanger{ background:#fee2e2; color:#991b1b; }
  .btnBlock{ width:100%; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .linkish{ border:0; background:none; color:#0f766e; font:inherit; font-weight:700; font-size:.85rem; padding:0; cursor:pointer; }
  .linkish.danger{ color:#b91c1c; }

  .hero{ position:sticky; top:0; z-index:10; gap:.45rem; }
  .heroRow{ display:flex; gap:.85rem; align-items:center; }
  .heroStats{ flex:1; min-width:0; }
  .bigNum{ font-size:1.85rem; font-weight:900; letter-spacing:-.03em; line-height:1; }
  .targetLine{ font-size:.95rem; font-weight:700; color:#334155; margin-top:.15rem; }
  .statusLine{ font-size:.82rem; color:var(--muted); margin-top:.35rem; }
  .statusLine.good{ color:#15803d; font-weight:700; }
  .statusLine.warn{ color:#b45309; font-weight:700; }

  .plateWrap{ position:relative; width:112px; height:112px; flex:none; }
  .plateSvg{ display:block; }
  .plateTrack{ fill:none; stroke:#e2e8f0; stroke-width:8; }
  .plateFill{ fill:none; stroke:#14b8a6; stroke-width:8; stroke-linecap:round; transition: stroke-dasharray .35s ease; }
  .plateFill.over{ stroke:#f97316; }
  .plateWrap.hit .plateFill{ stroke:#22c55e; }
  .plateCenter{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .plateEmoji{ font-size:1.35rem; line-height:1; }
  .platePct{ font-size:.78rem; font-weight:800; color:#0f766e; }

  .toast{ background:#0f766e; color:#ecfdf5; font-weight:800; font-size:.85rem; text-align:center;
    padding:.45rem .6rem; border-radius:.75rem; animation: pop .35s ease; }
  @keyframes pop{ from{ transform:translateY(6px); opacity:0 } to{ transform:none; opacity:1 } }

  .mChips{ display:flex; flex-wrap:wrap; gap:.3rem; align-items:center; margin-top:.25rem; }
  .mChip{ font-size:.68rem; font-weight:800; padding:.18rem .45rem; border-radius:999px; background:#f1f5f9; color:#334155; }
  .mChipUnit{ font-size:.65rem; color:var(--muted); }

  .chips{ display:flex; gap:.35rem; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:.15rem; }
  .chip{ flex:none; border:1px solid #cbd5e1; background:#fff; border-radius:999px; padding:.32rem .65rem; font-size:.75rem; font-weight:700; cursor:pointer; color:#334155; }
  .chip.on{ background:#0f766e; color:#fff; border-color:#0f766e; }

  .foodList{ display:flex; flex-direction:column; gap:.45rem; }
  .foodItem, .planItem{ display:grid; grid-template-columns:auto 1fr auto; gap:.55rem; align-items:center; border:1.5px solid #e2e8f0; border-radius:1rem; padding:.55rem .65rem; background:#fff; }
  .foodItem.featured{ border-color:#99f6e4; background:#f0fdfa; }
  .emoji{ font-size:1.45rem; }
  .name{ font-weight:800; font-size:.92rem; line-height:1.2; }
  .meta{ font-size:.75rem; color:var(--muted); margin-top:.12rem; }
  .meta b{ color:#0f766e; font-size:.85rem; }
  .foodActions{ display:flex; flex-direction:column; gap:.25rem; align-items:center; }
  .addBtn{ border:0; background:#0f766e; color:#fff; border-radius:.8rem; width:2.3rem; height:2.3rem; font-size:1.25rem; font-weight:800; cursor:pointer; line-height:1; }
  .srcBtn{ border:0; background:#e2e8f0; color:#475569; border-radius:999px; width:1.4rem; height:1.4rem; font-size:.7rem; font-weight:800; cursor:pointer; }
  .srcLine{ font-size:.65rem; color:#64748b; line-height:1.3; margin-top:.25rem; }

  .qty{ display:flex; align-items:center; gap:.2rem; }
  .qty button{ width:1.85rem; height:1.85rem; border-radius:.6rem; border:0; background:#e2e8f0; font-weight:900; cursor:pointer; }
  .qty span{ min-width:1.3rem; text-align:center; font-weight:800; }
  .remove{ border:0; background:transparent; color:#b91c1c; font-weight:800; font-size:.72rem; cursor:pointer; padding:.2rem; }

  .tabs{ display:flex; gap:.35rem; flex:none; }
  .tabs button{ flex:1; border:1px solid rgba(204,251,241,.28); background:rgba(2,6,23,.28); color:var(--ink); border-radius:.85rem; padding:.55rem .35rem; font:inherit; font-weight:800; font-size:.85rem; cursor:pointer; }
  .tabs button.on{ background:#fff; color:#064e3b; }

  .footerLinks{ display:flex; gap:.8rem; flex-wrap:wrap; font-size:.78rem; }
  .footerLinks a{ color:#0f766e; }

  .setSwitch{ display:inline-flex; gap:.3rem; }
  .setBtn{ border:1px solid #cbd5e1; background:#fff; border-radius:999px; padding:.28rem .55rem; font:inherit; font-size:.72rem; font-weight:800; cursor:pointer; color:#334155; }
  .setBtn.on{ background:#0f766e; color:#fff; border-color:#0f766e; }
  .mealRow{ display:flex; gap:.35rem; flex-wrap:wrap; align-items:stretch; }
  .mealChip{ flex:1 1 5.5rem; min-width:5.2rem; border:1.5px solid #e2e8f0; background:#f8fafc; border-radius:.85rem; padding:.45rem .5rem; text-align:left; cursor:pointer; font:inherit; }
  .mealChip b{ display:block; font-size:.72rem; color:#334155; }
  .mealChip span{ font-size:.78rem; font-weight:800; color:#0f766e; }
  .mealChip.on{ border-color:#14b8a6; background:#ecfdf5; box-shadow:0 0 0 2px rgba(20,184,166,.2); }
  .mealChip.filled span{ color:#15803d; }
  .mealAdjust{ display:inline-flex; align-items:center; gap:.25rem; }
  .mealAdjust button{ width:1.7rem; height:1.7rem; border:0; border-radius:.55rem; background:#e2e8f0; font-weight:900; cursor:pointer; }
  .suggestCard.soft{ background:#f8fafc; border-color:#e2e8f0; text-align:left; }

  .setSwitch{ display:flex; gap:.3rem; flex-wrap:wrap; justify-content:flex-end; max-width:100%; }
  .setBtn{ border:1px solid #cbd5e1; background:#fff; border-radius:999px; padding:.35rem .65rem; font:inherit; font-size:.72rem; font-weight:800; cursor:pointer; color:#334155; }
  .setBtn.on{ background:#0f766e; color:#fff; border-color:#0f766e; }
  .suggestRow{ display:flex; flex-direction:column; gap:.4rem; }
  .suggestCardBtn{ display:grid; grid-template-columns:auto 1fr auto; gap:.55rem; align-items:center; text-align:left;
    border:1.5px solid #99f6e4; background:#f0fdfa; border-radius:1rem; padding:.65rem .75rem; font:inherit; cursor:pointer; }
  .suggestCardBtn .name{ font-weight:800; font-size:.92rem; }
  .suggestCardBtn .meta b{ color:#0f766e; font-size:1rem; }
  .guide h2{ margin:0; }
  .celebrate{ text-align:center; background:linear-gradient(180deg,#ecfdf5,#fff); border:1.5px solid #99f6e4; }
  .celebrate h2{ color:#0f766e; }
  .mineralsCompact{ margin-top:.15rem; }
  .addBtn:disabled{ opacity:.35; cursor:not-allowed; }
</style>
<!-- draft sync mushrooms 2026-11-06 -->
</head>
<body>
<div class="safeCover" aria-hidden="true"></div>
<div class="shell">
  <div class="app" id="app" role="application" aria-label="Protein Planner"></div>
</div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
